---
- name: Disable SMBv1 when the feature exists
  ansible.windows.win_shell: |
    $changed = $false
    $features = @('SMB1Protocol', 'FS-SMB1', 'SMB1Protocol-Client', 'SMB1Protocol-Server')
    foreach ($feature in $features) {
      try {
        $state = (Get-WindowsOptionalFeature -Online -FeatureName $feature -ErrorAction Stop).State
        if ($state -eq 'Enabled') {
          Disable-WindowsOptionalFeature -Online -FeatureName $feature -NoRestart -ErrorAction Stop | Out-Null
          $changed = $true
        }
      } catch { }
    }
    if ($changed) { 'CHANGED' } else { 'OK' }
  register: smb1_result
  changed_when: "'CHANGED' in smb1_result.stdout"
  when: windows_disable_smb1 | bool

- name: Enforce legacy Windows password policy used by the team scripts
  ansible.windows.win_command: >-
    net accounts /MINPWLEN:{{ windows_password_min_length }}
    /MAXPWAGE:{{ windows_password_max_age }}
    /MINPWAGE:{{ windows_password_min_age }}
    /UNIQUEPW:{{ windows_password_history }}
    /FORCELOGOFF:30
  changed_when: false

- name: Harden Windows authentication and network security registry settings
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: dword
    state: present
  loop:
    - { path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa', name: 'LmCompatibilityLevel', data: 5 }
    - { path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa', name: 'NoLMHash', data: 1 }
    - { path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa', name: 'RestrictAnonymous', data: 1 }
    - { path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa', name: 'RestrictAnonymousSAM', data: 1 }
    - { path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa', name: 'EveryoneIncludesAnonymous', data: 0 }
    - { path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa', name: 'LimitBlankPasswordUse', data: 1 }
    - { path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0', name: 'allownullsessionfallback', data: 0 }
    - { path: 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters', name: 'EnablePlainTextPassword', data: 0 }
    - { path: 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters', name: 'EnableSecuritySignature', data: 1 }
    - { path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation', name: 'AllowInsecureGuestAuth', data: 0 }
    - { path: 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters', name: 'RequireSecuritySignature', data: 1 }
    - { path: 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters', name: 'SMB1', data: 0 }
    - { path: 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters', name: 'RestrictNullSessAccess', data: 1 }
    # Local Ansible is a local administrator. Keep the full remote token so
    # PSRP modules can perform administrative work without a second account.
    - { path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', name: 'LocalAccountTokenFilterPolicy', data: 1 }
    - { path: 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters', name: 'RequireSignOrSeal', data: 1 }
    - { path: 'HKLM:\SYSTEM\CurrentControlSet\Services\LDAP', name: 'LDAPClientIntegrity', data: 1 }
    - { path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc', name: 'RestrictRemoteClients', data: 1 }
    - { path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', name: 'ConsentPromptBehaviorAdmin', data: 2 }

- name: Disable legacy SMBv1 driver startup
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\mrxsmb10
    name: Start
    data: 4
    type: dword
    state: present

- name: Disable Teredo and other legacy IPv6 tunnels
  ansible.windows.win_shell: |
    netsh interface teredo set state disable | Out-Null
    netsh interface 6to4 set state state=disabled undoonstop=disabled | Out-Null
    netsh interface isatap set state state=disabled | Out-Null
  changed_when: false

- name: Disable the built-in Guest account
  ansible.windows.win_user:
    name: Guest
    account_disabled: true
    state: present

- name: Set the authorized-use legal notice
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: "{{ item }}"
    data: >-
      {{ ccdc_banner | default('Warning: Only authorized users are permitted to login. All network activity is being monitored and logged.') }}
    type: string
    state: present
  loop:
    - legalnoticecaption
    - legalnoticetext

- name: Enable Windows Defender protections when the cmdlet is available
  ansible.windows.win_shell: |
    if (Get-Command Set-MpPreference -ErrorAction SilentlyContinue) {
      Set-MpPreference -DisableRealtimeMonitoring $false -DisableIOAVProtection $false -DisableScriptScanning $false
    }
  changed_when: false
  when: windows_enable_defender | bool

- name: Disable RDP only when a role explicitly requests it
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server
    name: fDenyTSConnections
    data: 1
    type: dword
    state: present
  when: windows_disable_rdp | bool

- name: Enable high-value Windows audit subcategories
  ansible.windows.win_command: >-
    auditpol /set /subcategory:"{{ item }}" /success:enable /failure:enable
  loop:
    - Logon
    - Logoff
    - Account Lockout
    - User Account Management
    - Security Group Management
    - Process Creation
    - Audit Policy Change
    - System Integrity
  changed_when: false
