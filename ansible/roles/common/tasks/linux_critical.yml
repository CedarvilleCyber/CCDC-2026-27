---
- name: Create a protected local rollback directory
  ansible.builtin.file:
    path: /var/backups/ccdc-ansible
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: linux_create_backups | bool

- name: Check critical configuration files before changing them
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/ssh/sshd_config
    - /etc/sudoers
    - /etc/hosts
    - /etc/passwd
    - /etc/shadow
  register: linux_backup_sources
  when: linux_create_backups | bool

- name: Preserve critical configuration files once per target
  ansible.builtin.copy:
    src: "{{ item.item }}"
    dest: "/var/backups/ccdc-ansible/{{ item.item | regex_replace('/', '_') }}"
    remote_src: true
    force: false
    owner: root
    group: root
    mode: '0600'
  loop: "{{ linux_backup_sources.results | default([]) }}"
  when:
    - linux_create_backups | bool
    - item.stat.exists

- name: Refresh Debian package metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when:
    - ansible_facts.os_family == 'Debian'
    - linux_upgrade_packages | bool

- name: Apply Debian security and bug-fix updates
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  when:
    - ansible_facts.os_family == 'Debian'
    - linux_upgrade_packages | bool

- name: Apply Red Hat family security and bug-fix updates
  ansible.builtin.dnf:
    name: '*'
    state: latest
    update_only: true
  when:
    - ansible_facts.os_family == 'RedHat'
    - linux_upgrade_packages | bool

- name: Install Linux management and security prerequisites
  ansible.builtin.package:
    name: "{{ linux_security_packages }}"
    state: present

- name: Verify the staged Ansible account exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Install firewall implementation on Debian-family systems
  ansible.builtin.package:
    name: ufw
    state: present
  when: ansible_facts.os_family == 'Debian'

- name: Install firewall implementation on Red Hat-family systems
  ansible.builtin.package:
    name: firewalld
    state: present
  when: ansible_facts.os_family == 'RedHat'

- name: Start firewalld before adding allow rules
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: ansible_facts.os_family == 'RedHat'

- name: Allow required TCP services through firewalld
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    zone: public
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ linux_firewall_allowed_tcp }}"
  when: ansible_facts.os_family == 'RedHat'

- name: Allow required UDP services through firewalld
  ansible.posix.firewalld:
    port: "{{ item }}/udp"
    zone: public
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ linux_firewall_allowed_udp }}"
  when: ansible_facts.os_family == 'RedHat'

- name: Enable Debian firewall with a safe inbound default
  community.general.ufw:
    state: enabled
    # Start permissive so the current SSH connection survives until the
    # explicit management/service allows have been installed below.
    policy: allow
    direction: incoming
    logging: low
  when: ansible_facts.os_family == 'Debian'

- name: Allow required TCP services through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ linux_firewall_allowed_tcp }}"
  when: ansible_facts.os_family == 'Debian'

- name: Allow required UDP services through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
  loop: "{{ linux_firewall_allowed_udp }}"
  when: ansible_facts.os_family == 'Debian'

- name: Apply the final Debian inbound default after allow rules exist
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
    logging: low
  when: ansible_facts.os_family == 'Debian'

- name: Install the authorized-use banner
  ansible.builtin.copy:
    content: "{{ ccdc_banner | default('Warning: Only authorized users are permitted to login. All network activity is being monitored and logged.') }}\n"
    dest: "{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - /etc/issue
    - /etc/issue.net

- name: Install SSH banner file
  ansible.builtin.copy:
    content: "{{ ccdc_banner | default('Warning: Only authorized users are permitted to login. All network activity is being monitored and logged.') }}\n"
    dest: /etc/ssh/sshd-banner
    owner: root
    group: root
    mode: '0644'

- name: Apply SSH protections while retaining password access for Ansible
  ansible.builtin.blockinfile:
    path: "{{ linux_sshd_config }}"
    insertbefore: BOF
    marker: '# {mark} CCDC ANSIBLE HARDENING'
    block: |
      PasswordAuthentication yes
      PermitEmptyPasswords no
      PermitRootLogin no
      PubkeyAuthentication yes
      X11Forwarding no
      MaxAuthTries 4
      LoginGraceTime 30
      Banner /etc/ssh/sshd-banner
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Reload SSH daemon

- name: Flush SSH and firewall changes before lower-priority work
  ansible.builtin.meta: flush_handlers
