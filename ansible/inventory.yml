# 2026 Midwest Invitational CCDC Team 1 inventory.
# Endpoint details live in host_vars. The two network appliances are listed for
# topology completeness but are deliberately outside managed_endpoints until
# their device-specific Ansible transport is selected.
all:
  children:
    managed_endpoints:
      vars:
        # Connection identity belongs to the inventory so every Ansible CLI
        # and playbook invocation uses the staged account explicitly.
        ansible_user: ansible
      children:
        linux:
          children:
            ecomm:
              hosts:
                rocky-ecomm:
            email:
              hosts:
                ubuntu-email:
            splunk:
              hosts:
                debian-splunk:
            wkst:
              hosts:
                ubuntu-wkst:
            kali:
              hosts:
                kali-wkst:
        windows:
          children:
            ad:
              hosts:
                win2022-ad:
            mssql:
              hosts:
                win2019-mssql:
            win_wkst:
              hosts:
                win11-wkst:
    network_appliances:
      hosts:
        palo-alto:
        vyos-router:
