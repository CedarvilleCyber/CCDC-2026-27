---
# The real value is supplied by group_vars/all/vault.yml. Do not put a
# password in this file or in inventory.yml.
ansible_user: ansible
ansible_password: "{{ vault_ansible_password }}"

ccdc_team_number: 1
ccdc_banner: >-
  Warning: Only authorized users are permitted to login. All network activity
  is being monitored and logged, and may be used to investigate and prosecute
  any instance of unauthorized access.

# Do not guess a private NTP server. Set this when the competition supplies
# one; an empty list leaves the distribution's current sources in place.
linux_ntp_servers: []
linux_create_backups: true
linux_upgrade_packages: true
linux_disable_unattended_upgrades: true
linux_lock_unlisted_accounts: false
linux_disable_timers: false
